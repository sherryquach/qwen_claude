<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Sales Dashboard</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="header-top">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 3v18h18"></path>
              <path d="M7 14l3-4 3 3 4-6"></path>
            </svg>
          </span>
          <div class="brand-text">
            <h1 class="app-title">Restaurant Sales</h1>
            <p class="app-subtitle">Performance overview</p>
          </div>
        </div>
        <button type="button" id="refresh-btn" class="btn btn-primary" aria-label="Refresh sales data">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
            <path d="M21 3v6h-6"></path>
          </svg>
          <span>Refresh</span>
        </button>
      </div>

      <div class="date-range" role="group" aria-label="Date range filter">
        <div class="field">
          <label for="date-from">From</label>
          <input type="date" id="date-from" class="input" aria-describedby="status">
        </div>
        <div class="field">
          <label for="date-to">To</label>
          <input type="date" id="date-to" class="input" aria-describedby="status">
        </div>
      </div>
    </header>

    <main class="app-main">
      <div id="status" class="status" role="status" aria-live="polite"></div>

      <div id="loading" class="loading" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span>Loading sales data&hellip;</span>
      </div>

      <div id="error-box" class="error-box" role="alert" hidden></div>

      <section id="content" class="content" aria-label="Sales dashboard content">
        <section class="kpi-grid" aria-label="Key metrics">
          <article class="kpi-card">
            <span class="kpi-label">Revenue</span>
            <span class="kpi-value" id="kpi-revenue">&mdash;</span>
          </article>
          <article class="kpi-card">
            <span class="kpi-label">Transactions</span>
            <span class="kpi-value" id="kpi-transactions">&mdash;</span>
          </article>
          <article class="kpi-card">
            <span class="kpi-label">Avg Ticket</span>
            <span class="kpi-value" id="kpi-avg">&mdash;</span>
          </article>
          <article class="kpi-card">
            <span class="kpi-label">Items Sold</span>
            <span class="kpi-value" id="kpi-items">&mdash;</span>
          </article>
        </section>

        <div class="panels">
          <section class="panel" aria-labelledby="cat-heading">
            <h2 id="cat-heading" class="panel-title">Sales by Category</h2>
            <div id="category-list" class="category-list" aria-label="Category breakdown"></div>
          </section>

          <section class="panel" aria-labelledby="trend-heading">
            <h2 id="trend-heading" class="panel-title">7-Day Revenue Trend</h2>
            <div class="chart-wrap">
              <svg id="trend-svg" class="trend-svg" viewBox="0 0 640 260" role="img" aria-label="Line chart of revenue over the last seven days"></svg>
            </div>
          </section>

          <section class="panel panel-wide" aria-labelledby="items-heading">
            <h2 id="items-heading" class="panel-title">Top 10 Items</h2>
            <div class="table-wrap">
              <table id="items-table" class="items-table">
                <caption class="visually-hidden">Top ten items by revenue</caption>
                <thead>
                  <tr>
                    <th scope="col">Item</th>
                    <th scope="col" class="num">Qty</th>
                    <th scope="col" class="num">Revenue</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </section>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <span>Restaurant Sales &middot; Knowi</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
